<div
  id="modal-detail"
  class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4 sm:p-0 transition-opacity"
>
  <div
    class="card bg-white w-full max-w-md shadow-xl rounded-2xl overflow-hidden relative transform transition-all"
  >
    <button
      id="btn-close-detail"
      class="absolute top-4 right-4 text-gray-500 hover:text-gray-700 bg-white/80 rounded-full p-2 cursor-pointer z-10 backdrop-blur-sm shadow-sm transition-colors hover:bg-gray-100"
    >
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>
    <figure class="w-full h-60 bg-gray-100 relative overflow-hidden">
      <img
        id="detail-foto"
        src=""
        alt="Foto Laporan"
        class="w-full h-full object-cover transition-transform duration-300 hover:scale-105"
        onerror="this.src = 'https://via.placeholder.com/400x200?text=No+Image'"
      />
    </figure>
    <div class="card-body p-6">
      <h2 id="detail-judul" class="text-xl font-bold text-gray-800 mb-3 leading-tight">
        Judul Laporan
      </h2>

      <div class="flex flex-wrap gap-2 mb-4">
        <span
          id="detail-kategori"
          class="inline-block rounded-full bg-blue-100 text-blue-800 px-3 py-1 text-xs font-semibold tracking-wide uppercase"
          >Kategori</span
        >
        <span
          id="detail-status"
          class="inline-block rounded-full bg-yellow-100 text-yellow-800 px-3 py-1 text-xs font-semibold tracking-wide uppercase"
          >Status</span
        >
      </div>

      <div class="mb-5 bg-gray-50 p-4 rounded-xl border border-gray-100">
        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">
          Deskripsi Kerusakan
        </h3>
        <p id="detail-deskripsi" class="text-sm text-gray-700 leading-relaxed">
          Deskripsi lengkap mengenai laporan kerusakan...
        </p>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-2">
        <div class="bg-gray-50 p-3 rounded-lg border border-gray-100">
          <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Teknisi</h3>
          <p id="detail-teknisi" class="text-sm text-gray-800 font-medium">Nama Teknisi</p>
        </div>
        <div class="bg-gray-50 p-3 rounded-lg border border-gray-100">
          <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">
            Tanggal Masuk
          </h3>
          <p id="detail-tanggal" class="text-sm text-gray-800 font-medium">-</p>
        </div>
      </div>
    </div>
  </div>
</div>
