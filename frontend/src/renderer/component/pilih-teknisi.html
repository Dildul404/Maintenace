<div id="modal-pilih-teknisi" class="fixed inset-0 z-50 hidden items-center justify-center">
  <!-- Backdrop -->
  <div id="modal-pilih-teknisi-backdrop" class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm cursor-pointer"></div>
  
  <!-- Modal Content -->
  <div class="relative bg-white rounded-xl shadow-xl w-full max-w-md p-6 mx-4 transform transition-all border border-slate-100">
    <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
      <h3 class="text-base font-semibold text-slate-800">Tunjuk Teknisi</h3>
      <button id="btn-close-pilih-teknisi" class="text-slate-400 hover:text-slate-600 transition cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
        </svg>
      </button>
    </div>
    
    <form id="form-pilih-teknisi" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Nama Laporan</label>
        <p id="pilih-teknisi-judul-laporan" class="text-sm font-medium text-slate-800 bg-slate-50 p-2.5 rounded-lg border border-slate-100"></p>
      </div>
      
      <div>
        <label for="select-pilih-teknisi" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Pilih Teknisi</label>
        <select id="select-pilih-teknisi" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
          <option value="">-- Memuat Teknisi --</option>
        </select>
      </div>
      
      <div class="flex items-center justify-end gap-2 border-t border-slate-100 pt-4 mt-6">
        <button type="button" id="btn-batal-pilih-teknisi" class="px-4 py-2 border border-slate-200 hover:bg-slate-50 text-slate-700 rounded-lg text-xs font-medium cursor-pointer transition duration-150">Batal</button>
        <button type="button" id="btn-simpan-pilih-teknisi" class="px-4 py-2 bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg text-xs font-medium cursor-pointer transition duration-150">Simpan</button>
      </div>
    </form>
  </div>
</div>
