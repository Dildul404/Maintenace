<div id="modal-status" class="fixed inset-0 z-50 hidden items-center justify-center">
  <!-- Backdrop -->
  <div id="modal-status-backdrop" class="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity"></div>

  <!-- Modal Content -->
  <div
    class="relative z-10 w-full max-w-md mx-4 bg-white rounded-2xl shadow-2xl border border-gray-200 transform transition-all">
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
      <h2 class="text-lg font-semibold text-slate-800">Ubah Status Laporan</h2>
      <button id="btn-close-status"
        class="w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 hover:text-gray-600 transition-colors cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="px-6 py-5 space-y-4">
      <div>
        <p class="text-sm font-medium text-gray-500 mb-1">Judul Laporan:</p>
        <p id="status-laporan-judul" class="text-slate-800 font-semibold">-</p>
      </div>

      <div>
        <label for="input-edit-status" class="block text-sm font-medium text-gray-700 mb-1">Status Baru</label>
        <select id="input-edit-status"
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors bg-white">
          <option value="menunggu">Menunggu</option>
          <option value="proses">Proses</option>
          <option value="selesai">Selesai</option>
        </select>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-100">
      <button id="btn-batal-status" type="button"
        class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors cursor-pointer">
        Batal
      </button>
      <button id="btn-save-status" type="button"
        class="px-5 py-2.5 text-sm font-medium text-white bg-indigo-500 rounded-lg hover:bg-indigo-600 transition-colors cursor-pointer">
        Simpan Perubahan
      </button>
    </div>
  </div>
</div>
